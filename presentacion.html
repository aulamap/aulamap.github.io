<!DOCTYPE html>
<html lang="es" data-i18n-doc-title="about_doc_title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qué es AulaMap</title>
  <meta name="description" content="AulaMap sirve para decidir dónde se sienta cada alumno, con el plano real del aula y equipos cooperativos opcionales.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico" sizes="16x16 32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // Misma apariencia que la aplicación: el tema elegido allí se aplica aquí.
    (function () {
      try {
        var saved = localStorage.getItem('classe-theme');
        if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #f4f2ee; --panel: #ffffff; --ink: #23262b; --muted: #6b7078; --line: #d9d5cc;
      --accent: #2f6f5e; --accent-soft: #e3efe9; --on-accent: #ffffff;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14171a; --panel: #1b1f23; --ink: #e6e3dd; --muted: #9aa1a9; --line: #333a41;
        --accent: #6fbfa3; --accent-soft: #1f3630; --on-accent: #10211c;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #14171a; --panel: #1b1f23; --ink: #e6e3dd; --muted: #9aa1a9; --line: #333a41;
      --accent: #6fbfa3; --accent-soft: #1f3630; --on-accent: #10211c;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    }
    .top .brand { font-weight: 700; font-size: 18px; color: var(--accent); text-decoration: none; }
    .back {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px;
      background: var(--accent); color: var(--on-accent); text-decoration: none; font-size: 15px; font-weight: 600;
    }
    .back:hover { filter: brightness(1.08); }
    .top-right { display: flex; align-items: center; gap: 8px; }
    .lang {
      font: inherit; font-size: 13px; padding: 5px 4px; border-radius: 6px;
      border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    }
    .back svg { width: 16px; height: 16px; }

    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 56px; }
    h1 { font-size: 34px; line-height: 1.2; margin: 0 0 16px; }
    h2 { font-size: 23px; margin: 40px 0 10px; color: var(--accent); }
    p { margin: 0 0 14px; }
    ul { margin: 0 0 14px; padding-left: 22px; }
    li { margin: 4px 0; }
    a { color: var(--accent); }
    .lead { font-size: 19px; }

    figure { margin: 28px 0 8px; }
    figure img {
      display: block; width: 100%; height: auto; border-radius: 10px;
      border: 1px solid var(--line); background: #f3f0ea;
    }
    figcaption { font-size: 14px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

    .types { list-style: none; padding: 0; }
    .types li { display: flex; gap: 10px; align-items: baseline; }
    .tag {
      flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px;
      border: 1px solid var(--muted); border-radius: 4px; font-size: 13px; font-weight: 700;
      background: var(--panel);
    }
    .start { margin-top: 40px; text-align: center; }
    .start .back { font-size: 17px; padding: 11px 20px; }

    footer { text-align: center; font-size: 13px; color: var(--muted); padding: 0 16px 28px; }
    footer a { color: inherit; }

    @media (max-width: 600px) {
      body { font-size: 16px; }
      h1 { font-size: 27px; }
      h2 { font-size: 20px; }
      .lead { font-size: 17px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="./">AulaMap</a>
    <div class="top-right">
      <select id="lang" class="lang" aria-label="Idioma">
        <option value="auto" data-i18n="lang_auto">Automático</option>
        <option value="es">Español</option>
        <option value="ca">Català</option>
        <option value="gl">Galego</option>
        <option value="eu">Euskara</option>
        <option value="pt">Português</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select>
      <a class="back" href="./">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
        <span data-i18n="about_back">Ir al plano</span>
      </a>
    </div>
  </header>

  <main>
    <h1 data-i18n="about_h1">Qué es AulaMap</h1>

    <p class="lead" data-i18n-html="about_lead"></p>
    <p data-i18n-html="about_intro"></p>

    <figure>
      <img src="img/ejemplo-aula.webp" width="1200" height="1232" data-i18n-alt="about_fig_alt" alt="">
      <figcaption data-i18n="about_fig_caption"></figcaption>
    </figure>

    <h2 data-i18n="about_h_room"></h2>
    <p data-i18n="about_room_1"></p>
    <p data-i18n-html="about_room_2"></p>

    <h2 data-i18n="about_h_students"></h2>
    <p data-i18n-html="about_students_1"></p>
    <p data-i18n="about_students_2"></p>

    <h2 data-i18n="about_h_teams"></h2>
    <p data-i18n-html="about_teams_1"></p>
    <ul class="types">
      <li><span class="tag">A</span> <span data-i18n="about_type_a"></span></li>
      <li><span class="tag">B</span> <span data-i18n="about_type_b"></span></li>
      <li><span class="tag">C</span> <span data-i18n="about_type_c"></span></li>
    </ul>
    <p data-i18n="about_kinds"></p>
    <ul>
      <li data-i18n-html="about_kind_hetero"></li>
      <li data-i18n-html="about_kind_homo"></li>
      <li data-i18n-html="about_kind_temp"></li>
    </ul>
    <p data-i18n="about_incompat"></p>
    <p data-i18n-html="about_auto"></p>
    <p data-i18n-html="about_optional"></p>
    <ul>
      <li data-i18n="about_opt_1"></li>
      <li data-i18n="about_opt_2"></li>
      <li data-i18n="about_opt_3"></li>
    </ul>
    <p data-i18n="about_view"></p>

    <h2 data-i18n="about_h_privacy"></h2>
    <p data-i18n-html="about_privacy"></p>

    <p class="start">
      <a class="back" href="./">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
        <span data-i18n="about_back">Ir al plano</span>
      </a>
    </p>
  </main>

  <footer data-i18n-html="about_footer"></footer>

  <script src="locales/presentacion.js"></script>
  <script src="i18n.js"></script>
  <script>
    // Mismo idioma que la aplicación; el selector cambia el de las dos.
    (function () {
      var select = document.getElementById('lang');
      select.value = window.i18n.preference;
      select.addEventListener('change', function () { window.i18n.setPreference(select.value); });
      window.i18n.apply();
    })();
  </script>
</body>
</html>
